- name: Check if /var/run/docker.sock exists
  ansible.builtin.stat:
    path: /var/run/docker.sock
    follow: true
  register: macos_docker_socket_stat
  tags: containers

- name: Deploy container ubuntu-cnt
  community.docker.docker_container:
    name: ubuntu-cnt1
    hostname: ubuntu-cnt1
    image: ubuntu-cnt:latest
    pull: never
    restart_policy: unless-stopped
    env:
      TZ: Europe/Stockholm
  when: macos_docker_socket_stat.stat.exists
  tags: containers


- name: Create misc nnn bookmarks
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ shared_path_nnn_bms }}/{{ item.dest }}"
    state: link
    force: true
  loop:
    - src: "{{ shared_path_home }}/Library/CloudStorage/Dropbox/Split-Brain"
      dest: Dropbox - Split-Brain
    - src: "{{ shared_path_projects }}/Ansiblebot"
      dest: Projects - Ansiblebot
    - src: "{{ shared_path_projects }}/Kvickt"
      dest: Projects - Kvickt
    - src: "{{ shared_path_projects }}/Project-Assets"
      dest: Projects - Project-Assets
