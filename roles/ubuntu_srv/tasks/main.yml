- name: Set misc kernel parameters
  become: true
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-override.conf
    state: present
    reload: true
  loop:
    - { key: net.ipv4.ip_forward, value: 1 }
    - { key: net.ipv4.ip_unprivileged_port_start, value: 0 }
    - { key: net.ipv6.conf.all.forwarding, value: 1 }

- name: Disable DNSStubListener in systemd-resolved
  become: true
  ansible.builtin.lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: '^#?DNSStubListener='
    line: 'DNSStubListener=no'
    state: present
  notify: Restart systemd-resolved


- name: Add Tailscale APT repository
  become: true
  ansible.builtin.deb822_repository:
    name: tailscale
    uris: https://pkgs.tailscale.com/stable/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: https://pkgs.tailscale.com/stable/ubuntu/resolute.noarmor.gpg
    state: present
  notify: Update APT cache

- name: Run handlers immediately
  ansible.builtin.meta: flush_handlers

- name: Uninstall misc APT packages
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
    state: absent
  loop:
    - unattended-upgrades

- name: Install APT packages from list 'apt_ubuntu_srv'
  become: true
  ansible.builtin.apt:
    name: "{{ apt_ubuntu_srv }}"
    state: latest
  when: apt_ubuntu_srv is defined

- name: Install Homebrew packages from list 'linuxbrew_ubuntu_srv'
  community.general.homebrew:
    name: "{{ linuxbrew_ubuntu_srv }}"
    state: latest
  when: linuxbrew_ubuntu_srv is defined

- name: Install Go packages from list 'go_ubuntu_srv'
  ansible.builtin.command:
    cmd: go install "{{ item }}"
  environment:
    # This is needed when bootstraping (pre ~/.zshenv population).
    GOPATH: "{{ path_golang }}"
  loop: "{{ go_ubuntu_srv }}"
  when: go_ubuntu_srv is defined
  changed_when: true

- name: Install Pip packages from list 'pip_ubuntu_srv'
  ansible.builtin.pip:
    name: "{{ pip_ubuntu_srv }}"
    state: latest
    executable: "{{ pip_exec }}"
    extra_args: "{{ pip_args }}"
  when: pip_ubuntu_srv is defined


- name: Enable user lingering
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ ansible_facts['user_id'] }}"
    creates: "/var/lib/systemd/linger/{{ ansible_facts['user_id'] }}"
  tags: containers

- name: Create directories for containers
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0700"
  loop: "{{ ubuntu_srv_container_dirs }}"
  tags: containers

- name: Populate Caddyfile configuration
  ansible.builtin.template:
    src: templates/caddy/Caddyfile.j2
    dest: /srv/caddy/Caddyfile
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0644"
  notify: Reload Caddy
  tags: containers

- name: Create container network
  containers.podman.podman_network:
    name: "{{ item }}"
    state: present
  loop: "{{ ubuntu_srv_container_defaults.network }}"
  tags: containers

- name: Pull container images
  containers.podman.podman_image:
    name: "{{ item.image }}"
    force: true
  loop: "{{ ubuntu_srv_container_definitions }}"
  loop_control:
    label: "{{ item.image }}"
  register: images_pulled
  tags: containers

- name: Deploy all containers
  containers.podman.podman_container:
    name: "{{ item.item.name }}"
    hostname: "{{ hostname }}-{{ item.item.name }}"
    image: "{{ item.item.image }}"
    network: "{{ item.item.network | default(ubuntu_srv_container_defaults.network) }}"
    ports: "{{ item.item.ports | default(omit) }}"
    mount: "{{ item.item.mounts | default(omit) }}"
    env: "{{ ubuntu_srv_container_defaults.env | combine(item.item.env | default({})) }}"
    log_driver: "{{ ubuntu_srv_container_defaults.log_driver }}"
    log_opt: "{{ ubuntu_srv_container_defaults.log_opt }}"
    recreate: "{{ item.changed }}"
  loop: "{{ images_pulled.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  tags: containers

- name: Generate systemd units for containers
  containers.podman.podman_generate_systemd:
    name: "{{ item.name }}"
    no_header: true
    dest: ~/.config/systemd/user
    restart_policy: always
  loop: "{{ ubuntu_srv_container_definitions }}"
  loop_control:
    label: "{{ item.name }}"
  tags: containers

- name: Enable systemd units for containers
  ansible.builtin.systemd:
    name: "container-{{ item.name }}"
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ ubuntu_srv_container_definitions }}"
  loop_control:
    label: "container-{{ item.name }}"
  tags: containers


- name: Execute misc 'tailscale completion zsh' command
  ansible.builtin.shell:
    cmd: tailscale completion zsh > {{ path_brew }}/share/zsh/site-functions/_tailscale
  changed_when: true


- name: Create misc nnn bookmarks
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ path_nnn_bms }}/{{ item.dest }}"
    state: link
    force: true
  loop:
    - src: /media/external
      dest: media - external
