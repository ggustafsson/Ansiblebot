- name: Install APT packages from list 'shared_apt_ubuntu_vm'
  become: true
  ansible.builtin.apt:
    name: "{{ shared_apt_ubuntu_vm }}"
    state: latest
  when: shared_apt_ubuntu_vm is defined

- name: Install Homebrew packages from list 'shared_linuxbrew_ubuntu_vm'
  community.general.homebrew:
    name: "{{ shared_linuxbrew_ubuntu_vm }}"
    state: latest
  when: shared_linuxbrew_ubuntu_vm is defined

- name: Install Go packages from list 'shared_go_ubuntu_vm'
  ansible.builtin.command:
    cmd: go install {{ item | quote }}
  environment:
    # This is needed when bootstraping (pre ~/.zshenv population).
    GOPATH: "{{ shared_path_golang }}"
  loop: "{{ shared_go_ubuntu_vm }}"
  when: shared_go_ubuntu_vm is defined
  changed_when: true

- name: Install Pip packages from list 'shared_pip_ubuntu_vm'
  ansible.builtin.pip:
    name: "{{ shared_pip_ubuntu_vm }}"
    state: latest
    executable: "{{ shared_pip_exec }}"
    extra_args: "{{ shared_pip_args }}"
  when: shared_pip_ubuntu_vm is defined
