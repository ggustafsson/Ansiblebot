- name: Setup macOS system - Home
  hosts: macos
  vars:
    hostname: Onett
    shared_git_16x256: git@github.com:ggustafsson/16x256.nvim.git
    shared_git_dotfiles: git@github.com:ggustafsson/Dotfiles.git
    shared_git_godis: git@github.com:ggustafsson/godis.git
    shared_git_kjell: git@github.com:ggustafsson/Kjell.git
    shared_git_kvickt: git@github.com:ggustafsson/Kvickt.git
    shared_git_nnndir: git@github.com:ggustafsson/nnn-dir.nvim.git
    shared_git_projectassets: git@github.com:ggustafsson/Project-Assets.git
    shared_git_pyttipanna: git@github.com:ggustafsson/Pyttipanna.git
    shared_git_skrot: git@github.com:ggustafsson/Skrot.git
  roles:
    - { role: common, tags: common }
    - { role: macos, tags: macos }
    - { role: macos_home, tags: macos_home }
    - { role: common_nvim, tags: common_nvim }
    - { role: common_post, tags: common_post }
