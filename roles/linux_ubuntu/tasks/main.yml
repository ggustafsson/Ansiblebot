- name: Upgrade all APT packages
  become: true
  ansible.builtin.apt:
    update_cache: true
    upgrade: full
    autoremove: true

- name: Install APT packages from list 'apt_ubuntu'
  become: true
  ansible.builtin.apt:
    name: "{{ apt_ubuntu }}"
    state: latest
  when: apt_ubuntu is defined

- name: Upgrade all Homebrew packages
  community.general.homebrew:
    update_homebrew: true
    upgrade_all: true
    force_formula: true
    path: "{{ path_brew }}/bin"

- name: Install Homebrew packages from list 'linuxbrew_ubuntu'
  community.general.homebrew:
    name: "{{ linuxbrew_ubuntu }}"
    state: latest
    force_formula: true
    path: "{{ path_brew }}/bin"
  when: linuxbrew_ubuntu is defined

- name: Install Go packages from list 'go_ubuntu'
  ansible.builtin.shell:
    # Custom GOPATH is needed when bootstraping (pre ~/.zshenv population).
    cmd: GOPATH={{ path_golang | quote }} go install {{ item | quote }}
  loop: "{{ go_ubuntu }}"
  when: go_ubuntu is defined
  changed_when: false

- name: Install Pip packages from list 'pip_ubuntu'
  ansible.builtin.pip:
    name: "{{ pip_ubuntu }}"
    state: latest
    executable: "{{ pip_exec }}"
    extra_args: "{{ pip_args }}"
  when: pip_ubuntu is defined


- name: Set timezone to Europe/Stockholm
  become: true
  community.general.timezone:
    name: Europe/Stockholm

- name: Ensure locale sv_SE.UTF-8 is present
  become: true
  community.general.locale_gen:
    name: sv_SE.UTF-8
    state: present

- name: Disable dynamic MOTD in PAM configurations
  become: true
  vars:
    rule_1: { regexp: '(session\s+optional\s+pam_motd.so\s+motd=/run/motd.dynamic)', line: '# \1' }
    rule_2: { regexp: '(session\s+optional\s+pam_motd.so noupdate)', line: '# \1' }
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    backrefs: true
  loop:
    - "{{ rule_1 | combine({'path': '/etc/pam.d/login'}) }}"
    - "{{ rule_2 | combine({'path': '/etc/pam.d/login'}) }}"
    - "{{ rule_1 | combine({'path': '/etc/pam.d/sshd'}) }}"
    - "{{ rule_2 | combine({'path': '/etc/pam.d/sshd'}) }}"

- name: Create file /etc/ssh/sshd_config.d/AllowUsers.conf
  become: true
  ansible.builtin.template:
    src: sshd_config.d/AllowUsers.conf.j2
    dest: /etc/ssh/sshd_config.d/AllowUsers.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart SSH

- name: Add public SSH key to authorized_keys
  ansible.posix.authorized_key:
    user: "{{ ansible_facts['user_id'] }}"
    key: "{{ lookup('file', 'id_ed25519.pub') }}"
    state: present
    exclusive: true

- name: Create misc directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ path_home }}/Documents/Text"

- name: Create misc symbolic links as root
  become: true
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
  loop:
    - src: /usr/bin/fdfind
      dest: /usr/bin/fd

- name: Create misc symbolic links as user
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
  loop:
    - src: "{{ path_brew }}/opt/fzf"
      dest: "{{ path_home }}/.local/share/fzf"
    - src: "{{ path_brew }}/opt/zsh-autosuggestions/share/zsh-autosuggestions"
      dest: "{{ path_home }}/.local/share/zsh-autosuggestions"
