- name: Install APT packages from list 'apt_ubuntu_tv'
  ansible.builtin.apt:
    name: "{{ apt_ubuntu_tv }}"
    state: latest
  become: true
  when: apt_ubuntu_tv is defined

- name: Install Homebrew packages from list 'linuxbrew_ubuntu_tv'
  community.general.homebrew:
    name: "{{ linuxbrew_ubuntu_tv }}"
    state: latest
    force_formula: true
  when: linuxbrew_ubuntu_tv is defined

- name: Install Go packages from list 'go_ubuntu_tv'
  ansible.builtin.shell:
    # Custom GOPATH is needed when bootstraping (pre ~/.zshenv population).
    cmd: GOPATH={{ path_golang | quote }} go install {{ item | quote }}
  loop: "{{ go_ubuntu_tv }}"
  when: go_ubuntu_tv is defined
  changed_when: false

- name: Install Pip packages from list 'pip_ubuntu_tv'
  ansible.builtin.pip:
    name: "{{ pip_ubuntu_tv }}"
    state: latest
    executable: "{{ pip_exec }}"
    extra_args: "{{ pip_args }}"
  when: pip_ubuntu_tv is defined


- name: Create Jellyfin directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    mode: "0755"
  loop:
    - /media/external/Jellyfin
    - /media/external/Jellyfin/config
    - /media/external/Jellyfin/cache

- name: Deploy Jellyfin container
  containers.podman.podman_container:
    name: jellyfin
    hostname: "{{ hostname }}-jellyfin"
    image: docker.io/jellyfin/jellyfin
    restart_policy: on-failure
    ports:
      - "7359:7359/udp"
      - "8096:8096/tcp"
    mount:
      - "type=bind,source=/media/external,target=/media,ro=true"
      - "type=bind,source=/media/external/Jellyfin/config,target=/config"
      - "type=bind,source=/media/external/Jellyfin/cache,target=/cache"

