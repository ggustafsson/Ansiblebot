# noqa: command-instead-of-module
- name: Get latest Homebrew git tag
  listen: Homebrew git branch
  ansible.builtin.command:
    cmd: git describe --tags --abbrev=0
    chdir: "{{ shared_path_brew }}"
  register: common_git_tags
  changed_when: false

# noqa: command-instead-of-module
- name: Checkout latest tag on branch stable
  listen: Homebrew git branch
  ansible.builtin.command:
    cmd: git checkout --quiet --force -B stable {{ common_git_tags.stdout_lines | first }}
    chdir: "{{ shared_path_brew }}"
  when: common_git_tags.stdout_lines | length > 0
  changed_when: true
