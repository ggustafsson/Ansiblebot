- name: Create file /etc/sudoers.d/custom
  become: true
  ansible.builtin.template:
    src: sudoers.d/custom.j2
    dest: /etc/sudoers.d/custom
    owner: root
    group: wheel
    mode: "0640"

- name: Create misc directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ shared_path_home }}/Library/CloudStorage/Dropbox"
    - "{{ shared_path_home }}/Library/CloudStorage/Dropbox/Split-Brain"
    - "{{ shared_path_home }}/Library/CloudStorage/Dropbox/Split-Brain/Text"
    - "{{ shared_path_home }}/Storage"

- name: Git clone/pull misc projects
  ansible.builtin.git:
    repo: "{{ item.url }}"
    dest: "{{ shared_path_projects }}/{{ item.name }}"
  diff: false
  loop:
    - name: "Kvickt"
      url: "{{ shared_git_kvickt }}"
    - name: "Project-Assets"
      url: "{{ shared_git_projectassets }}"

- name: Create misc symbolic links
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
  loop:
    - src: "{{ shared_path_dotfiles }}/gnupg/gpg-agent.conf"
      dest: "{{ shared_path_home }}/.gnupg/gpg-agent.conf"
    - src: "{{ shared_path_home }}/Library/CloudStorage/Dropbox/Split-Brain/Text"
      dest: "{{ shared_path_home }}/Documents/Text"

- name: Delete misc files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ shared_path_home }}/Desktop/.localized"
    - "{{ shared_path_home }}/Documents/.localized"
    - "{{ shared_path_home }}/Downloads/.localized"
    - "{{ shared_path_home }}/Library/.localized"
    - "{{ shared_path_home }}/Movies/.localized"
    - "{{ shared_path_home }}/Music/.localized"
    - "{{ shared_path_home }}/Pictures/.localized"
    - "{{ shared_path_home }}/Public/.localized"
    - "{{ shared_path_home }}/Sites/.localized"


- name: Upgrade all Homebrew packages
  community.general.homebrew:
    update_homebrew: true
    upgrade_all: true
  environment:
    SUDO_ASKPASS: "{{ shared_sudo_askpass }}"

- name: Install Homebrew packages from list 'shared_brew_macos'
  community.general.homebrew:
    name: "{{ shared_brew_macos }}"
    state: latest
  when: shared_brew_macos is defined

- name: Install Homebrew applications from list 'shared_cask_macos'
  community.general.homebrew_cask:
    name: "{{ shared_cask_macos }}"
    state: latest
  environment:
    SUDO_ASKPASS: "{{ shared_sudo_askpass }}"
  when: shared_cask_macos is defined

- name: Install Go packages from list 'shared_go_macos'
  ansible.builtin.command:
    cmd: go install {{ item | quote }}
  environment:
    # This is needed when bootstraping (pre ~/.zshenv population).
    GOPATH: "{{ shared_path_golang }}"
  loop: "{{ shared_go_macos }}"
  when: shared_go_macos is defined
  changed_when: true

- name: Install Pip packages from list 'shared_pip_macos'
  ansible.builtin.pip:
    name: "{{ shared_pip_macos }}"
    state: latest
    executable: "{{ shared_pip_exec }}"
    extra_args: "{{ shared_pip_args }}"
  when: shared_pip_macos is defined


- name: Check installed Visual Studio Code extensions
  ansible.builtin.command:
    cmd: code --list-extensions
  register: macos_code_extensions
  changed_when: false

- name: Install Visual Studio Code extensions
  ansible.builtin.command:
    cmd: code --install-extension {{ item | quote }}
  loop:
    - asvetliakov.vscode-neovim
    - golang.go
    - ms-azuretools.vscode-docker
    - ms-python.flake8
    - ms-python.pylint
    - ms-python.python
    - ms-vscode-remote.remote-containers
    - ms-vscode-remote.remote-ssh
    - ms-vscode-remote.remote-ssh-edit
    - redhat.ansible
    - redhat.vscode-yaml
    - rust-lang.rust-analyzer
    - terrastruct.d2
  when: item not in macos_code_extensions.stdout
  changed_when: true


- name: Create misc directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ shared_path_home }}/.docker/cli-plugins"
    - "{{ shared_path_home }}/Library/Application Support/Code"
    - "{{ shared_path_home }}/Library/Application Support/Code/User"

- name: Create misc symbolic links
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
  loop:
    - src: /opt/homebrew/opt/docker-compose/bin/docker-compose
      dest: "{{ shared_path_home }}/.docker/cli-plugins/docker-compose"
    - src: "{{ shared_path_dotfiles }}/hammerspoon"
      dest: "{{ shared_path_home }}/.hammerspoon"
    - src: "{{ shared_path_brew }}/opt/fzf"
      dest: "{{ shared_path_home }}/.local/share/fzf"
    - src: "{{ shared_path_brew }}/opt/zsh-autosuggestions/share/zsh-autosuggestions"
      dest: "{{ shared_path_home }}/.local/share/zsh-autosuggestions"
    - src: "{{ shared_path_dotfiles }}/vscode/keybindings.json"
      dest: "{{ shared_path_home }}/Library/Application Support/Code/User/keybindings.json"
    - src: "{{ shared_path_dotfiles }}/vscode/settings.json"
      dest: "{{ shared_path_home }}/Library/Application Support/Code/User/settings.json"

- name: Add {{ shared_path_brew }}/bin/zsh to /etc/shells
  become: true
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: "{{ shared_path_brew }}/bin/zsh"


- name: Execute misc 'defaults' commands
  ansible.builtin.command:
    cmd: "{{ item }}"
  loop:
    - defaults write com.microsoft.VSCode ApplePressAndHoldEnabled -bool false

    # Dock
    - defaults write com.apple.Dock appswitcher-all-displays -bool true
    - defaults write com.apple.Dock mru-spaces -bool false
    - defaults write com.apple.Dock showAppExposeGestureEnabled -bool true
    - defaults write com.apple.Dock tilesize -int 48

    # Finder
    - defaults write NSGlobalDomain AppleShowAllExtensions -bool true
    - defaults write com.apple.finder DownloadsFolderListViewSettingsVersion -bool true
    - defaults write com.apple.finder FXDefaultSearchScope -string SCcf
    - defaults write com.apple.finder FXEnableExtensionChangeWarning -bool false
    - defaults write com.apple.finder FXEnableRemoveFromICloudDriveWarning -bool false
    - defaults write com.apple.finder FXPreferredViewStyle -string clmv
    - defaults write com.apple.finder FXRemoveOldTrashItems -bool true
    - defaults write com.apple.finder NewWindowTarget -string PfHm
    - defaults write com.apple.finder ShowRecentTags -bool false
    - defaults write com.apple.finder WarnOnEmptyTrash -bool false

    # Keyboard
    - defaults write NSGlobalDomain AppleKeyboardUIMode -int 2
    - defaults write NSGlobalDomain InitialKeyRepeat -int 15
    - defaults write NSGlobalDomain KeyRepeat -int 2
    - defaults write NSGlobalDomain NSAutomaticDashSubstitutionEnabled -bool false
    - defaults write NSGlobalDomain NSAutomaticQuoteSubstitutionEnabled -bool false
    - defaults write NSGlobalDomain NSAutomaticSpellingCorrectionEnabled -bool false
    - defaults write NSGlobalDomain WebAutomaticSpellingCorrectionEnabled -bool false
  changed_when: false

