- name: Set misc kernel parameters
  become: true
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-override.conf
    state: present
    reload: true
  loop:
    - { key: fs.inotify.max_user_watches, value: 524288 }
    - { key: net.ipv4.ip_forward, value: 1 }
    - { key: net.ipv4.ip_unprivileged_port_start, value: 0 }
    - { key: net.ipv6.conf.all.forwarding, value: 1 }

- name: Disable DNSStubListener in systemd-resolved
  become: true
  ansible.builtin.lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: '^#?DNSStubListener='
    line: 'DNSStubListener=no'
    state: present
  notify: Restart systemd-resolved


- name: Add Tailscale APT repository
  become: true
  ansible.builtin.deb822_repository:
    name: tailscale
    uris: https://pkgs.tailscale.com/stable/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: https://pkgs.tailscale.com/stable/ubuntu/resolute.noarmor.gpg
    state: present
  notify: Update APT cache

- name: Run handlers immediately
  ansible.builtin.meta: flush_handlers

- name: Uninstall misc APT packages
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
    state: absent
  loop:
    - unattended-upgrades

- name: Install APT packages from list 'apt_ubuntu_srv'
  become: true
  ansible.builtin.apt:
    name: "{{ apt_ubuntu_srv }}"
    state: latest
  when: apt_ubuntu_srv is defined

- name: Install Homebrew packages from list 'linuxbrew_ubuntu_srv'
  community.general.homebrew:
    name: "{{ linuxbrew_ubuntu_srv }}"
    state: latest
    force_formula: true
  when: linuxbrew_ubuntu_srv is defined

- name: Install Go packages from list 'go_ubuntu_srv'
  ansible.builtin.shell:
    # Custom GOPATH is needed when bootstraping (pre ~/.zshenv population).
    cmd: GOPATH={{ path_golang | quote }} go install {{ item | quote }}
  loop: "{{ go_ubuntu_srv }}"
  when: go_ubuntu_srv is defined
  changed_when: false

- name: Install Pip packages from list 'pip_ubuntu_srv'
  ansible.builtin.pip:
    name: "{{ pip_ubuntu_srv }}"
    state: latest
    executable: "{{ pip_exec }}"
    extra_args: "{{ pip_args }}"
  when: pip_ubuntu_srv is defined


- name: Create directories for containers
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0700"
  loop:
    - /srv/adguard
    - /srv/adguard/conf
    - /srv/adguard/work
    - /srv/caddy
    - /srv/jellyfin
    - /srv/jellyfin/cache
    - /srv/jellyfin/config
  tags: containers

- name: Enable linger for user
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ ansible_facts['user_id'] }}"
    creates: "/var/lib/systemd/linger/{{ ansible_facts['user_id'] }}"

- name: Create shared container network
  containers.podman.podman_network:
    name: internal
    state: present
    # recreate: true
    # force: true
  tags: containers

- name: Populate Caddyfile configuration
  ansible.builtin.template:
    src: templates/caddy/Caddyfile.j2
    dest: /srv/caddy/Caddyfile
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0644"
  vars:
    sites:
      - { domain: "adguard.{{ hostname }}.local", upstream: adguard:80 }
      - { domain: "jellyfin.{{ hostname }}.local", upstream: jellyfin:8096 }
  notify: Reload Caddy
  tags: containers

- name: Deploy container caddy
  containers.podman.podman_container:
    name: caddy
    hostname: "{{ hostname }}-caddy"
    image: docker.io/library/caddy:latest
    pull: newer
    network:
      - internal
    ports:
      - 443:443/tcp
    mount:
      - type=bind,source=/srv/caddy/Caddyfile,target=/etc/caddy/Caddyfile,ro=true
    log_opt:
      max_size: 100mb
    env:
      TZ: Europe/Stockholm
  tags: containers

- name: Deploy container adguard
  containers.podman.podman_container:
    name: adguard
    hostname: "{{ hostname }}-adguard"
    image: docker.io/adguard/adguardhome:latest
    pull: newer
    network:
      - internal
    ports:
      - 53:53/udp
      - 53:53/tcp
      - 80:80/tcp
      - 3000:3000/tcp
    mount:
      - type=bind,source=/srv/adguard/conf,target=/opt/adguardhome/conf
      - type=bind,source=/srv/adguard/work,target=/opt/adguardhome/work
    log_opt:
      max_size: 100mb
    env:
      TZ: Europe/Stockholm
  tags: containers

- name: Deploy container jellyfin
  containers.podman.podman_container:
    name: jellyfin
    hostname: "{{ hostname }}-jellyfin"
    image: docker.io/jellyfin/jellyfin:latest
    pull: newer
    network:
      - internal
    ports:
      - 7359:7359/udp
      - 8096:8096/tcp
    mount:
      - type=bind,source=/media/external,target=/media,ro=true
      - type=bind,source=/srv/jellyfin/config,target=/config
      - type=bind,source=/srv/jellyfin/cache,target=/cache
    log_opt:
      max_size: 100mb
    env:
      TZ: Europe/Stockholm
  tags: containers

- name: Generate systemd units for containers
  containers.podman.podman_generate_systemd:
    name: "{{ item }}"
    no_header: true
    dest: ~/.config/systemd/user
    restart_policy: always
  loop: &container_list
    - adguard
    - caddy
    - jellyfin
  tags: containers

- name: Ensure containers are started and enabled
  ansible.builtin.systemd:
    name: "container-{{ item }}"
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  loop: *container_list
  tags: containers


- name: Create misc nnn bookmarks
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ path_nnn_bms }}/{{ item.dest }}"
    state: link
    force: true
  loop:
    - src: /media/external
      dest: media - external
