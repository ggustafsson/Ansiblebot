- name: Set hostname to {{ hostname }}
  become: true
  ansible.builtin.hostname:
    name: "{{ hostname }}"
  when: ansible_facts.virtualization_type != "docker"


- name: Set misc directory permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0700"
  loop:
    - "{{ shared_path_home }}"
    - "{{ shared_path_home }}/.gnupg"
    - "{{ shared_path_home }}/.ssh"

- name: Get stats on {{ shared_path_home }}/.ssh/id_ed25519
  ansible.builtin.stat:
    path: "{{ shared_path_home }}/.ssh/id_ed25519"
  register: common_id_ed25519

- name: Set file permissions on {{ shared_path_home }}/.ssh/id_ed25519
  ansible.builtin.file:
    path: "{{ shared_path_home }}/.ssh/id_ed25519"
    state: file
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"
  when: common_id_ed25519.stat.exists


- name: Create directory {{ shared_path_brew }}
  become: true
  ansible.builtin.file:
    path: "{{ shared_path_brew }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0700"

- name: Git clone Homebrew repo
  ansible.builtin.git:
    repo: "{{ shared_git_brew }}"
    dest: "{{ shared_path_brew }}"
    single_branch: true
    update: false # Let Homebrew handle updates.
  diff: false
  notify: Homebrew git branch

- name: Run handlers immediately
  ansible.builtin.meta: flush_handlers


- name: Create misc directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ shared_path_home }}/.config"
    - "{{ shared_path_nnn_bms }}"
    - "{{ shared_path_home }}/.local"
    - "{{ shared_path_home }}/.local/bin"
    - "{{ shared_path_home }}/.local/share"
    - "{{ shared_path_home }}/Documents"
    - "{{ shared_path_home }}/Downloads"
    - "{{ shared_path_home }}/Playground"
    - "{{ shared_path_projects }}"

- name: Git clone/pull misc projects
  ansible.builtin.git:
    repo: "{{ item.url }}"
    dest: "{{ shared_path_projects }}/{{ item.name }}"
  diff: false
  loop:
    - name: "Dotfiles"
      url: "{{ shared_git_dotfiles }}"
    - name: "Godis"
      url: "{{ shared_git_godis }}"
    - name: "Kjell"
      url: "{{ shared_git_kjell }}"
    - name: "Pyttipanna"
      url: "{{ shared_git_pyttipanna }}"
    - name: "Skrot"
      url: "{{ shared_git_skrot }}"

- name: Create misc symbolic links
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
  loop:
    - src: "{{ shared_path_dotfiles }}/config/htop"
      dest: "{{ shared_path_home }}/.config/htop"
    - src: "{{ shared_path_dotfiles }}/config/pylintrc"
      dest: "{{ shared_path_home }}/.config/pylintrc"
    - src: "{{ shared_path_dotfiles }}/config/yamllint"
      dest: "{{ shared_path_home }}/.config/yamllint"
    - src: "{{ shared_path_dotfiles }}/gitconfig"
      dest: "{{ shared_path_home }}/.gitconfig"
    - src: "{{ shared_path_dotfiles }}/gitignore_global"
      dest: "{{ shared_path_home }}/.gitignore_global"
    - src: "{{ shared_path_dotfiles }}/local/share/figlet"
      dest: "{{ shared_path_home }}/.local/share/figlet"
    - src: "{{ shared_path_dotfiles }}/lynxrc"
      dest: "{{ shared_path_home }}/.lynxrc"
    - src: "{{ shared_path_dotfiles }}/pythonrc"
      dest: "{{ shared_path_home }}/.pythonrc"
    - src: "{{ shared_path_dotfiles }}/ssh/config"
      dest: "{{ shared_path_home }}/.ssh/config"
    - src: "{{ shared_path_dotfiles }}/tmux.conf"
      dest: "{{ shared_path_home }}/.tmux.conf"
    - src: "{{ shared_path_dotfiles }}/zlogin"
      dest: "{{ shared_path_home }}/.zlogin"
    - src: "{{ shared_path_dotfiles }}/zshenv"
      dest: "{{ shared_path_home }}/.zshenv"
    - src: "{{ shared_path_dotfiles }}/zshrc"
      dest: "{{ shared_path_home }}/.zshrc"


- name: Create misc nnn bookmarks
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ shared_path_nnn_bms }}/{{ item.dest }}"
    state: link
    force: true
  loop:
    - src: "{{ shared_path_home }}/Documents/Text"
      dest: Documents - Text
    - src: "{{ shared_path_projects }}/Dotfiles"
      dest: Projects - Dotfiles
    - src: "{{ shared_path_projects }}/Godis"
      dest: Projects - Godis
    - src: "{{ shared_path_projects }}/Kjell/src"
      dest: Projects - Kjell
    - src: "{{ shared_path_projects }}/Pyttipanna/src"
      dest: Projects - Pyttipanna
    - src: "{{ shared_path_projects }}/Skrot"
      dest: Projects - Skrot
