- name: Install Go packages from list 'go_common'
  ansible.builtin.shell:
    # Custom GOPATH is needed when bootstraping (pre ~/.zshenv population).
    cmd: GOPATH={{ path_golang | quote }} go install {{ item | quote }}
  loop: "{{ go_common }}"
  when: go_common is defined
  changed_when: true

- name: Install Pip packages from list 'pip_common'
  ansible.builtin.pip:
    name: "{{ pip_common }}"
    state: latest
    executable: "{{ pip_exec }}"
    extra_args: "{{ pip_args }}"
  when: pip_common is defined


- name: Get stats on {{ path_home }}/.rustup
  ansible.builtin.stat:
    path: "{{ path_home }}/.rustup"
  register: rustup

- name: Execute command 'rustup install'
  ansible.builtin.command:
    cmd: "{{ path_brew }}/bin/rustup install"
  when: not rustup.stat.exists
  changed_when: true

- name: Execute command 'rustup update'
  ansible.builtin.command:
    cmd: "{{ path_brew }}/bin/rustup update"
  when: rustup.stat.exists
  changed_when: true

- name: Execute command 'rustup completions zsh cargo'
  ansible.builtin.shell:
    cmd: "{{ path_brew }}/bin/rustup completions zsh cargo > {{ path_brew }}/share/zsh/site-functions/_cargo"
  changed_when: true
