- name: Add misc Homebrew taps
  community.general.homebrew_tap:
    name: "{{ item }}"
    state: present
  loop:
    - hashicorp/tap

- name: Install Homebrew packages from list 'shared_brew_macos_work'
  community.general.homebrew:
    name: "{{ shared_brew_macos_work }}"
    state: latest
  when: shared_brew_macos_work is defined

- name: Install Homebrew applications from list 'shared_cask_macos_work'
  community.general.homebrew_cask:
    name: "{{ shared_cask_macos_work }}"
    state: latest
  environment:
    SUDO_ASKPASS: "{{ shared_sudo_askpass }}"
  when: shared_cask_macos_work is defined

- name: Install Go packages from list 'shared_go_macos_work'
  ansible.builtin.command:
    cmd: go install {{ item | quote }}
  environment:
    # This is needed when bootstraping (pre ~/.zshenv population).
    GOPATH: "{{ shared_path_golang }}"
  loop: "{{ shared_go_macos_work }}"
  when: shared_go_macos_work is defined
  changed_when: true

- name: Install Pip packages from list 'shared_pip_macos_work'
  ansible.builtin.pip:
    name: "{{ shared_pip_macos_work }}"
    state: latest
    executable: "{{ shared_pip_exec }}"
    extra_args: "{{ shared_pip_args }}"
  when: shared_pip_macos_work is defined


- name: Check installed Visual Studio Code extensions
  ansible.builtin.command:
    cmd: code --list-extensions
  register: macos_work_code_extensions
  changed_when: false

- name: Install Visual Studio Code extensions
  ansible.builtin.command:
    cmd: code --install-extension {{ item | quote }}
  loop:
    - opentofu.vscode-opentofu
    - ms-kubernetes-tools.vscode-kubernetes-tools
  when: item not in macos_work_code_extensions.stdout
  changed_when: true


- name: Create misc directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ shared_path_home }}/Bitbucket"
