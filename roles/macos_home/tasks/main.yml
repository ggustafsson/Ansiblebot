- name: Install Homebrew packages from list 'shared_brew_macos_home'
  community.general.homebrew:
    name: "{{ shared_brew_macos_home }}"
    state: latest
  when: shared_brew_macos_home is defined

- name: Install Homebrew applications from list 'shared_cask_macos_home'
  community.general.homebrew_cask:
    name: "{{ shared_cask_macos_home }}"
    state: latest
  environment:
    SUDO_ASKPASS: "{{ shared_sudo_askpass }}"
  when: shared_cask_macos_home is defined

- name: Install Go packages from list 'shared_go_macos_home'
  ansible.builtin.command:
    cmd: go install {{ item | quote }}
  environment:
    # This is needed when bootstraping (pre ~/.zshenv population).
    GOPATH: "{{ shared_path_golang }}"
  loop: "{{ shared_go_macos_home }}"
  when: shared_go_macos_home is defined
  changed_when: true

- name: Install Pip packages from list 'shared_pip_macos_home'
  ansible.builtin.pip:
    name: "{{ shared_pip_macos_home }}"
    state: latest
    executable: "{{ shared_pip_exec }}"
    extra_args: "{{ shared_pip_args }}"
  when: shared_pip_macos_home is defined


- name: Create misc directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ shared_path_home }}/Library/CloudStorage/Dropbox/Reading"

- name: Create misc symbolic links
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
  loop:
    - src: "{{ shared_path_home }}/Library/CloudStorage/Dropbox/Reading"
      dest: "{{ shared_path_home }}/Documents/Reading"


- name: Execute misc 'tailscale completion zsh' command
  ansible.builtin.shell:
    cmd: tailscale completion zsh > {{ shared_path_brew }}/share/zsh/site-functions/_tailscale
  changed_when: true


- name: Create misc nnn bookmarks
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ shared_path_nnn_bms }}/{{ item.dest }}"
    state: link
    force: true
  loop:
    - src: /Volumes/External
      dest: Volumes - External
    - src: /Volumes/Keychain
      dest: Volumes - Keychain
