- name: Install Go packages from list 'shared_go_common'
  ansible.builtin.command:
    cmd: go install {{ item | quote }}
  environment:
    # This is needed when bootstraping (pre ~/.zshenv population).
    GOPATH: "{{ shared_path_golang }}"
  loop: "{{ shared_go_common }}"
  when: shared_go_common is defined
  changed_when: true

- name: Install Pip packages from list 'shared_pip_common'
  ansible.builtin.pip:
    name: "{{ shared_pip_common }}"
    state: latest
    executable: "{{ shared_pip_exec }}"
    extra_args: "{{ shared_pip_args }}"
  when: shared_pip_common is defined


- name: Get stats on {{ shared_path_home }}/.rustup
  ansible.builtin.stat:
    path: "{{ shared_path_home }}/.rustup"
  register: common_post_rustup

- name: Execute command 'rustup install' etc
  ansible.builtin.command:
    # Path is needed when bootstraping (pre ~/.zshenv population).
    cmd: "{{ shared_path_brew }}/bin/{{ item }}"
  loop:
    - rustup install
    - rustup component add rust-analyzer
  when: not common_post_rustup.stat.exists
  changed_when: true

- name: Execute command 'rustup update'
  ansible.builtin.command:
    # See comment above...
    cmd: "{{ shared_path_brew }}/bin/rustup update"
  when: common_post_rustup.stat.exists
  changed_when: true

- name: Execute command 'rustup completions zsh cargo'
  ansible.builtin.shell:
    # See comment above...
    cmd: "{{ shared_path_brew }}/bin/rustup completions zsh cargo > {{ shared_path_brew }}/share/zsh/site-functions/_cargo"
  changed_when: true
