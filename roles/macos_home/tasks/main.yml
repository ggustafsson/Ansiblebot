- name: Install Homebrew packages from list 'brew_macos_home'
  community.general.homebrew:
    name: "{{ brew_macos_home }}"
    state: latest
  when: brew_macos_home is defined

- name: Install Homebrew applications from list 'cask_macos_home'
  community.general.homebrew_cask:
    name: "{{ cask_macos_home }}"
    state: latest
  environment:
    SUDO_ASKPASS: "{{ cask_sudo_askpass }}"
  when: cask_macos_home is defined

- name: Install Go packages from list 'go_macos_home'
  ansible.builtin.command:
    cmd: go install {{ item | quote }}
  environment:
    # This is needed when bootstraping (pre ~/.zshenv population).
    GOPATH: "{{ path_golang }}"
  loop: "{{ go_macos_home }}"
  when: go_macos_home is defined
  changed_when: true

- name: Install Pip packages from list 'pip_macos_home'
  ansible.builtin.pip:
    name: "{{ pip_macos_home }}"
    state: latest
    executable: "{{ pip_exec }}"
    extra_args: "{{ pip_args }}"
  when: pip_macos_home is defined


- name: Create misc directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ path_home }}/Library/CloudStorage/Dropbox/Reading"

- name: Create misc symbolic links
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
  loop:
    - src: "{{ path_home }}/Library/CloudStorage/Dropbox/Reading"
      dest: "{{ path_home }}/Documents/Reading"


- name: Execute misc 'tailscale completion zsh' command
  ansible.builtin.shell:
    cmd: tailscale completion zsh > {{ path_brew }}/share/zsh/site-functions/_tailscale
  changed_when: true


- name: Create misc nnn bookmarks
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ path_nnn_bms }}/{{ item.dest }}"
    state: link
    force: true
  loop:
    - src: /Volumes/External
      dest: Volumes - External
    - src: /Volumes/Keychain
      dest: Volumes - Keychain
