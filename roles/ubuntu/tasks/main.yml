- name: Upgrade all APT packages
  become: true
  ansible.builtin.apt:
    update_cache: true
    upgrade: full
    autoremove: true

- name: Install APT packages from list 'shared_apt_ubuntu'
  become: true
  ansible.builtin.apt:
    name: "{{ shared_apt_ubuntu }}"
    state: latest
  when: shared_apt_ubuntu is defined

- name: Upgrade all Homebrew packages
  community.general.homebrew:
    update_homebrew: true
    upgrade_all: true
    path: "{{ shared_path_brew }}/bin"

- name: Install Homebrew packages from list 'shared_linuxbrew_ubuntu'
  community.general.homebrew:
    name: "{{ shared_linuxbrew_ubuntu }}"
    state: latest
    path: "{{ shared_path_brew }}/bin"
  when: shared_linuxbrew_ubuntu is defined

- name: Install Go packages from list 'shared_go_ubuntu'
  ansible.builtin.command:
    cmd: go install {{ item | quote }}
  environment:
    # This is needed when bootstraping (pre ~/.zshenv population).
    GOPATH: "{{ shared_path_golang }}"
  loop: "{{ shared_go_ubuntu }}"
  when: shared_go_ubuntu is defined
  changed_when: true

- name: Install Pip packages from list 'shared_pip_ubuntu'
  ansible.builtin.pip:
    name: "{{ shared_pip_ubuntu }}"
    state: latest
    executable: "{{ shared_pip_exec }}"
    extra_args: "{{ shared_pip_args }}"
  when: shared_pip_ubuntu is defined


- name: Set timezone to Europe/Stockholm
  become: true
  community.general.timezone:
    name: Europe/Stockholm

- name: Ensure locale sv_SE.UTF-8 is present
  become: true
  community.general.locale_gen:
    name: sv_SE.UTF-8
    state: present

- name: Disable dynamic MOTD in PAM configurations
  become: true
  vars:
    rule_1: { regexp: '(session\s+optional\s+pam_motd.so\s+motd=/run/motd.dynamic)', line: '# \1' }
    rule_2: { regexp: '(session\s+optional\s+pam_motd.so noupdate)', line: '# \1' }
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    backrefs: true
  loop:
    - "{{ rule_1 | combine({'path': '/etc/pam.d/login'}) }}"
    - "{{ rule_2 | combine({'path': '/etc/pam.d/login'}) }}"
    - "{{ rule_1 | combine({'path': '/etc/pam.d/sshd'}) }}"
    - "{{ rule_2 | combine({'path': '/etc/pam.d/sshd'}) }}"

- name: Create file /etc/ssh/sshd_config.d/AllowUsers.conf
  become: true
  ansible.builtin.template:
    src: sshd_config.d/AllowUsers.conf.j2
    dest: /etc/ssh/sshd_config.d/AllowUsers.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart SSH

- name: Add public SSH keys to authorized_keys
  ansible.posix.authorized_key:
    user: "{{ ansible_facts['user_id'] }}"
    key: "{% for key in query('fileglob', 'ssh/*.pub') %}{{ lookup('file', key) ~ '\n' }}{% endfor %}"
    state: present
    exclusive: true

- name: Create misc directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ shared_path_home }}/Documents/Text"

- name: Create misc symbolic links as root
  become: true
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
  loop:
    - src: /usr/bin/fdfind
      dest: /usr/bin/fd

- name: Create misc symbolic links as user
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
  loop:
    - src: "{{ shared_path_brew }}/opt/fzf"
      dest: "{{ shared_path_home }}/.local/share/fzf"
    - src: "{{ shared_path_brew }}/opt/zsh-autosuggestions/share/zsh-autosuggestions"
      dest: "{{ shared_path_home }}/.local/share/zsh-autosuggestions"
